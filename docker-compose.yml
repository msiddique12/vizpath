services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: vizpath
      POSTGRES_PASSWORD: vizpath
      POSTGRES_DB: vizpath
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vizpath"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://vizpath:vizpath@postgres:5432/vizpath
      REDIS_URL: redis://redis:6379
      DEBUG: "true"
      AUTO_CREATE_TABLES: "true"
      ALLOW_UNAUTHENTICATED_DEV_FALLBACK: ${ALLOW_UNAUTHENTICATED_DEV_FALLBACK:-false}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_LLM_MODEL: ${NVIDIA_LLM_MODEL:-nvidia/llama-3.3-nemotron-super-49b-v1.5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
        VITE_WS_BASE_URL: ws://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  postgres_data:
