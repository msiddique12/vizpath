name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-dependency-audit:
    name: Python Dependency Audit (${{ matrix.component }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        component: [server, sdk]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit tooling and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e "./${{ matrix.component }}[dev]"

      - name: Run pip-audit
        run: pip-audit --progress-spinner off

  dashboard-dependency-audit:
    name: Dashboard Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './dashboard/package-lock.json'

      - name: Install dependencies
        working-directory: ./dashboard
        run: npm ci || npm install

      - name: Run npm audit (prod deps, high+)
        working-directory: ./dashboard
        run: npm audit --omit=dev --audit-level=high
