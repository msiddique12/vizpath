name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-sdk:
    name: SDK Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate CI contract
        run: python scripts/ci_guard.py

      - name: Install dependencies
        working-directory: ./sdk
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: ./sdk
        run: pytest tests/ -v --cov=vizpath --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          files: ./sdk/coverage.xml
          flags: sdk

  test-server:
    name: Server Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate CI contract
        run: python scripts/ci_guard.py

      - name: Install dependencies
        working-directory: ./server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: ./server
        env:
          DATABASE_URL: sqlite:///./test.db
        run: pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./server/coverage.xml
          flags: server

  test-dashboard:
    name: Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './dashboard/package-lock.json'

      - name: Install dependencies
        working-directory: ./dashboard
        run: npm ci || npm install

      - name: Type check
        working-directory: ./dashboard
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./dashboard
        run: npm run build

      - name: Run tests
        working-directory: ./dashboard
        run: npm test

  test-smoke-e2e:
    name: Smoke E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate CI contract
        run: python scripts/ci_guard.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./server[dev]"
          pip install -e ./sdk

      - name: Install dashboard dependencies
        working-directory: ./dashboard
        run: npm ci || npm install

      - name: Run smoke E2E checks
        run: bash scripts/run_smoke_ci.sh
